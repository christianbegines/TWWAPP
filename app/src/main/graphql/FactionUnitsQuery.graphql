query factionUnitsQuery($tww_version: String!, $faction: String! ) {
  tww(tww_version: $tww_version) {
    tww_version
    faction(id: $faction) {
      key
      screen_name
      flags_url
      units(groupHeroesAndLords: true) {
        unit
        caste
        num_men
        multiplayer_cost
        unit_sets {
          special_category
          __typename
        }
        custom_battle_permissions {
          general_portrait
          campaign_exclusive
          __typename
        }
        land_unit {
          onscreen_name
          variant {
            unit_card_url
            __typename
          }
          battle_entity {
            size
          }
          abilities {
            icon_name
            key
            name
            tooltip
            __typename
          }
          attributes {
            key
            bullet_text
            imbued_effect_text
            __typename
          }
          special_ability_groups {
            abilities {
              icon_name
              key
              name
              tooltip
              __typename
            }
            __typename
          }
          __typename
        }
        ui_unit_group {
          icon
          key
          name
          tooltip
          __typename
        }
        __typename
      }
      __typename
    }
    __typename
  }
}