    onscreen_name
    duration
    effect_type
    requested_stance
    unbreakable
    cant_move
    freeze_fatigue
    fatigue_change_ratio
    ability_recharge_change
    hp_change_frequency
    heal_amount
    damage_chance
    damage_amount
    max_damaged_entities
    resurrect
    mana_regen_mod
    mana_max_depletion_mod
    imbue_magical
    imbue_ignition
    phase_display
    imbue_contact {
        id
        onscreen_name
        duration
        effect_type
        requested_stance
        unbreakable
        cant_move
        freeze_fatigue
        fatigue_change_ratio
        ability_recharge_change
        hp_change_frequency
        heal_amount
        damage_chance
        damage_amount
        max_damaged_entities
        resurrect
        mana_regen_mod
        mana_max_depletion_mod
        imbue_magical
        imbue_ignition
        phase_display
        stat_effects {
            phase
            stat
            value
            how
            __typename
        }
        attribute_effects {
            phase
            attribute
            attribute_type
            __typename
        }
        __typename
    }
    stat_effects {
        phase
        stat
        value
        how
        __typename
    }
    attribute_effects {
        phase
        attribute
        attribute_type
        __typename
    }
    __typename
}
fragment projectile_ability on projectile {
    key
    category
    shot_type
    explosion {
        ...explosion_ability
        __typename
    }
    projectile_number
    effective_range
    minimum_range
    marksmanship_bonus
    damage
    ap_damage
    collision_radius
    base_reload_time
    bonus_v_cavalry
    bonus_v_infantry
    bonus_v_large
    calibration_distance
    calibration_area
    max_elevation
    overhead_stat_effect {
        ...contact_phase_ability
        __typename
    }
    contact_stat_effect {
        ...contact_phase_ability
        __typename
    }
    projectile_penetration {
        key
        entity_size_cap
        max_penetration
        description
        __typename
    }
    burst_size
    burst_shot_delay
    ignition_amount
    is_magical
    shots_per_volley
    can_damage_buildings
    __typename
}
fragment explosion_ability on explosion {
    key
    detonation_damage
    detonation_damage_ap
    is_magical
    ignition_amount
    detonation_radius
    detonation_duration
    detonation_speed
    shrapnel_amount
    distance_from_target
    detonation_force
    shrapnel_type
    contact_phase_effect {
        ...contact_phase_ability
        __typename
    }
    __typename
}
